# Render Blueprint — deploys the backend API (free plan)
# Render dashboard -> New -> Blueprint -> select this repository
services:
  - type: web
    name: campus-event-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"   # after deploying the frontend, change to your Vercel URL
